[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uno-q-fruit-sorter"
version = "1.1.0"
description = "Safety-oriented YOLOv8 fruit sorting robot for Arduino UNO Q"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "ultralytics>=8.3,<9",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pydantic>=2.7,<3",
  "msgpack>=1.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fruit-sorter = "fruit_sorter.main:cli"
fruit-sorter-calibrate = "fruit_sorter.calibrate_workspace:cli"
fruit-sorter-validate = "fruit_sorter.validate_config:cli"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
fruit_sorter = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
addopts = "-q"
